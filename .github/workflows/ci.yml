# rig-enforcement base 1 (CI template for Laravel)
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3' # same version as production
          extensions: mbstring, sqlite3
          coverage: pcov
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - uses: actions/setup-node@v5
        if: hashFiles('package-lock.json') != ''
        with:
          node-version: 22
          cache: npm
      - name: Build frontend
        if: hashFiles('package-lock.json') != ''
        run: npm ci && npm run build
      - name: Prepare app
        run: |
          touch database/database.sqlite
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
      - name: Pint
        run: vendor/bin/pint --test
      - name: Larastan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Pest with coverage
        run: vendor/bin/pest --coverage --min=70

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: composer audit
        run: composer audit --locked
      - name: npm audit
        if: (success() || failure()) && hashFiles('package-lock.json') != ''
        run: npm audit --audit-level=high

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  claude-md:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: CLAUDE.md length (warning only)
        run: |
          # With Laravel Boost the project part lives in .ai/guidelines/.
          if [ -d .ai/guidelines ]; then
            lines=$(cat .ai/guidelines/*.md 2>/dev/null | wc -l)
          elif [ -f CLAUDE.md ]; then
            lines=$(wc -l < CLAUDE.md)
          else
            exit 0
          fi
          if [ "$lines" -gt 60 ]; then
            echo "::warning file=CLAUDE.md::The project part of CLAUDE.md has $lines lines (guide: about 60)."
          fi
