# rig-enforcement CI (jobs from ditshej/rig-ci)
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels the older run; runs on main finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    uses: ditshej/rig-ci/.github/workflows/laravel-quality.yml@v1
    with:
      php-version: '8.3' # same version as production
  security:
    uses: ditshej/rig-ci/.github/workflows/security.yml@v1
    with:
      php-version: '8.3'
  gitleaks:
    uses: ditshej/rig-ci/.github/workflows/gitleaks.yml@v1
    permissions:
      contents: read
      pull-requests: read
